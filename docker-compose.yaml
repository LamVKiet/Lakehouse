services:
  # =========================================
  # KAFKA CLUSTER (3 NODES - KRaft mode)
  # =========================================
  kafka-1:
    image: confluentinc/cp-kafka:${KAFKA_VERSION}
    container_name: kafka-1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      CLUSTER_ID: '${CLUSTER_ID}'
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:29093,2@kafka-2:29093,3@kafka-3:29093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:19092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_KRAFT_MODE: 'true'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_1_data:/var/lib/kafka/data

  kafka-2:
    image: confluentinc/cp-kafka:${KAFKA_VERSION}
    container_name: kafka-2
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 2
      CLUSTER_ID: '${CLUSTER_ID}'
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:29093,2@kafka-2:29093,3@kafka-3:29093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:19094,EXTERNAL://0.0.0.0:9094,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:19094,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_KRAFT_MODE: 'true'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_2_data:/var/lib/kafka/data

  kafka-3:
    image: confluentinc/cp-kafka:${KAFKA_VERSION}
    container_name: kafka-3
    ports:
      - "9096:9096"
    environment:
      KAFKA_NODE_ID: 3
      CLUSTER_ID: '${CLUSTER_ID}'
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:29093,2@kafka-2:29093,3@kafka-3:29093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:19096,EXTERNAL://0.0.0.0:9096,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:19096,EXTERNAL://localhost:9096
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_KRAFT_MODE: 'true'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_3_data:/var/lib/kafka/data

  # =========================================
  # KAFKA UI
  # =========================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:19092,kafka-2:19094,kafka-3:19096

  # =========================================
  # KAFKA CONNECT (Debezium — MySQL CDC -> Kafka)
  # =========================================
  kafka-connect:
    image: debezium/connect:2.7.3.Final
    container_name: kafka-connect
    ports:
      - "8083:8083"   # Connect REST API
    environment:
      BOOTSTRAP_SERVERS: "kafka-1:19092,kafka-2:19094,kafka-3:19096"
      GROUP_ID: "debezium-connect-cluster"
      CONFIG_STORAGE_TOPIC: "_connect_configs"
      OFFSET_STORAGE_TOPIC: "_connect_offsets"
      STATUS_STORAGE_TOPIC: "_connect_status"
      CONFIG_STORAGE_REPLICATION_FACTOR: "3"
      OFFSET_STORAGE_REPLICATION_FACTOR: "3"
      STATUS_STORAGE_REPLICATION_FACTOR: "3"
      KEY_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      VALUE_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xms1G -Xmx4G"
    depends_on:
      kafka-1:
        condition: service_started
      kafka-2:
        condition: service_started
      kafka-3:
        condition: service_started
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8083/connectors"]
      interval: 10s
      timeout: 5s
      retries: 10

  # =========================================
  # SPARK CLUSTER (Master + Worker)
  # =========================================
  spark-master:
    build:
      context: .
      dockerfile: Dockerfile.spark
    container_name: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master --webui-port 8081
    ports:
      - "8081:8081"   # Spark Master UI
      - "7077:7077"   # Spark Master RPC
    environment:
      SPARK_NO_DAEMONIZE: "true"
    volumes:
      - spark_jars:/opt/spark/jars
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8081"]
      interval: 10s
      timeout: 5s
      retries: 5

  spark-worker-1:
    build:
      context: .
      dockerfile: Dockerfile.spark
    container_name: spark-worker-1
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker --webui-port 8082 spark://spark-master:7077
    ports:
      - "8082:8082"   # Spark Worker UI
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_WORKER_MEMORY: "4g"
      SPARK_WORKER_CORES: "4"
    volumes:
      - spark_jars:/opt/spark/jars
    depends_on:
      spark-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8082"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================================
  # SPARK STREAMING: Kafka -> S3/Delta Bronze
  # =========================================
  spark-bronze-job:
    build:
      context: .
      dockerfile: Dockerfile.spark
    container_name: spark-bronze-job
    command: >
      /opt/spark/bin/spark-submit
      --master spark://spark-master:7077
      --deploy-mode client
      --driver-memory 2g
      --executor-memory 4g
      --executor-cores 6
      --total-executor-cores 6
      --conf spark.executor.memoryOverhead=256m
      --conf spark.driver.host=spark-bronze-job
      --conf spark.ui.port=4040
      /app/processing/spark_jobs/streaming_to_bronze.py
    ports:
      - "4040:4040"   # Spark Application UI (driver runs here in client mode)
    volumes:
      - ./processing:/app/processing
      - spark_checkpoints:/checkpoints
      - spark_jars:/opt/spark/jars
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka-1:19092,kafka-2:19094,kafka-3:19096"
      CHECKPOINT_BASE: "/checkpoints/bronze"
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      S3_BUCKET: ${S3_BUCKET}
    depends_on:
      spark-master:
        condition: service_healthy
      spark-worker-1:
        condition: service_healthy
      kafka-1:
        condition: service_started
    restart: on-failure

  # =========================================
  # MYSQL (Backend operational data — raw SQL layer)
  # =========================================
  mysql:
    image: mysql:8.0
    container_name: mysql
    # Debezium CDC prerequisites: ROW binlog + full row image + unique server-id
    command: >
      --server-id=1
      --log-bin=mysql-bin
      --binlog-format=ROW
      --binlog-row-image=FULL
      --gtid-mode=ON
      --enforce-gtid-consistency=ON
      --innodb_flush_log_at_trx_commit=2
      --sync_binlog=0
      --innodb_buffer_pool_size=2G
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_DATABASE: ${MYSQL_DB}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infra/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_pass"]
      interval: 10s
      timeout: 5s
      retries: 10

  # =========================================
  # DATA SIMULATOR (FastAPI)
  # =========================================
  data-simulator:
    build: .
    container_name: data-simulator
    ports:
      - "${SIMULATOR_PORT:-8000}:8000"
    command: ["uvicorn", "ingestion.simulator.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================================
  # PYTHON PRODUCER (calls simulator -> Kafka)
  # =========================================
  python-producer:
    build: .
    # NO container_name — a fixed name pins the service to exactly 1 container and
    # silently caps `--scale`. Omit it so `docker compose up --scale python-producer=N` works.
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka-1:19092,kafka-2:19094,kafka-3:19096"
      SIMULATOR_URL: "http://data-simulator:8000"
      BYPASS_SIMULATOR: "true"
      DISABLE_DLQ: "true"
      THROUGHPUT_LIMIT: "2500"
      FALLBACK_PATH: "/app/dlq/clickstream_fallback.jsonl"   # named volume (fast) — NOT the slow Windows bind-mount
    depends_on:
      data-simulator:
        condition: service_healthy
      kafka-1:
        condition: service_started
      kafka-2:
        condition: service_started
    volumes:
      - producer_dlq:/app/dlq   # local SQLite DLQ — persist buffered events across restarts
      - ./fallback:/app/fallback   # local fallback logs for easy inspection on host
      - ./ingestion:/app/ingestion # Mount ingestion code for instant updates without rebuild
      - ./common:/app/common       # Mount common code for instant updates without rebuild
    command: ["python", "-u", "ingestion/producer/behavior_events_producer.py"]

  # =========================================
  # JUPYTER NOTEBOOK (PySpark + Delta Lake)
  # =========================================
  jupyter:
    build:
      context: .
      dockerfile: Dockerfile.spark
    container_name: jupyter-lab
    command: jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token=${JUPYTER_TOKEN}
    ports:
      - "8889:8888"   # host 8888 bị Antigravity IDE chiếm -> map ra 8889
    environment:
      JUPYTER_ENABLE_LAB: "yes"
      JUPYTER_TOKEN: "${JUPYTER_TOKEN}"
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      S3_BUCKET: ${S3_BUCKET}
    volumes:
      - ./notebooks:/app/notebooks
      - ./processing:/app/processing
      - spark_jars:/opt/spark/jars
    depends_on:
      - kafka-1
      - spark-master

  # =========================================
  # AIRFLOW (Batch orchestration: Silver + Gold)
  # =========================================
  airflow:
    build:
      context: .
      dockerfile: Dockerfile.spark
      args:
        INSTALL_AIRFLOW: "true"
    container_name: airflow
    command: >
      bash -c "
        mkdir -p /opt/airflow;
        airflow db migrate;
        airflow users create --username admin --password admin --firstname Admin --lastname Admin --role Admin --email admin@localhost || true;
        (while true; do airflow scheduler; echo 'Scheduler exited, restarting...'; sleep 5; done) &
        exec airflow webserver --port 8080
      "
    ports:
      - "8085:8080"
      - "4041-4045:4040-4044"   # Expose Spark UI range for jobs submitted by Airflow
    environment:
      AIRFLOW_HOME: /opt/airflow
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      AIRFLOW__CORE__FERNET_KEY: "0iabGv98nVF-CXMbodDIHlQyTnk3RmKD104uCGpnFGQ="
      # SMTP — send_email() in DAGs reads these; Gmail STARTTLS on 587.
      AIRFLOW__SMTP__SMTP_HOST: ${SMTP_HOST}
      AIRFLOW__SMTP__SMTP_PORT: ${SMTP_PORT}
      AIRFLOW__SMTP__SMTP_STARTTLS: "true"
      AIRFLOW__SMTP__SMTP_SSL: "false"
      AIRFLOW__SMTP__SMTP_USER: ${SMTP_USER}
      AIRFLOW__SMTP__SMTP_PASSWORD: ${SMTP_PASSWORD}
      AIRFLOW__SMTP__SMTP_MAIL_FROM: ${SMTP_MAIL_FROM}
      SPARK_HOME: /opt/spark
      KAFKA_BOOTSTRAP_SERVERS: "kafka-1:19092,kafka-2:19094,kafka-3:19096"
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      S3_BUCKET: ${S3_BUCKET}
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DB: ${MYSQL_DB}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ./orchestration/dags:/opt/airflow/dags
      - ./processing:/app/processing
      - airflow_logs:/opt/airflow/logs
      - spark_jars:/opt/spark/jars
      - spark_cdc_checkpoints:/checkpoints/cdc   # CDC streaming checkpoint (driver runs here in client mode)
    depends_on:
      spark-master:
        condition: service_healthy
      mysql:
        condition: service_healthy

volumes:
  kafka_1_data:
  kafka_2_data:
  kafka_3_data:
  spark_checkpoints:
  spark_cdc_checkpoints:    # CDC streaming checkpoints, organized per table (/checkpoints/cdc/<table>)
  airflow_logs:
  mysql_data:
  spark_jars:
  producer_dlq:    # clickstream producer local SQLite DLQ (Kafka-outage buffer)
